<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Add new book</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form>

                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Title</label>
                        <input type="text" class="form-control" id="bookTitle">
                        <!--<div class="form-text">We'll never share your email with anyone else.</div>-->
                    </div>

                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Author</label>
                        <input type="text" class="form-control" id="bookAuthor">
                    </div>

                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Page Number</label>
                        <input type="number" class="form-control" id="bookPgnumber">
                    </div>

                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Year</label>
                        <input type="number" class="form-control" id="bookYear">
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="isItRead">
                        <label class="form-check-label">Mark as read</label>
                    </div>
                    <button type="submit" class="btn btn-primary" id="addbook">Submit</button>
                </form>
            </div>
